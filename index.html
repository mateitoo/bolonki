<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bolonki</title>
  <link rel="stylesheet" href="./src/style.css">
  <!-- three-cdn -->
</head>
<body data-mode="menu">
  <main class="stage" id="stage" tabindex="0" aria-label="Bolonki">
    <div class="screen scanlines" id="screen">
      <canvas id="gl"></canvas>
      <canvas id="hud" width="320" height="240"></canvas>
      <canvas id="hires"></canvas>
    </div>

    <div class="touch" aria-hidden="true">
      <div class="stick" id="stick" aria-label="Mover"><div class="knob" id="knob"></div></div>
      <button id="tp" class="pause" aria-label="Pausa">❚❚</button>
      <button id="th" class="hit" aria-label="Golpe">GOLPE</button>
    </div>
    <!-- para escribir el apodo / el código desde el celular (abre el teclado del teléfono) -->
    <input id="txtin" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" inputmode="text">
    <div class="rotate" aria-hidden="true"><div>↻</div><p>GIRÁ EL CELULAR<br>PARA JUGAR</p></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
