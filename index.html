<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bolonki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./src/style.css">
  <!-- three-cdn -->
</head>
<body data-mode="menu">
  <main class="stage" id="stage" tabindex="0" aria-label="Bolonki">
    <div class="screen scanlines" id="screen">
      <canvas id="gl"></canvas>
      <canvas id="hud" width="320" height="240"></canvas>
      <canvas id="hires"></canvas>
    </div>

    <div class="touch" aria-hidden="true">
      <div class="dir">
        <button id="tl" aria-label="Izquierda">◀</button>
        <button id="tr" aria-label="Derecha">▶</button>
      </div>
      <button id="tp" class="pause" aria-label="Pausa">❚❚</button>
      <button id="th" class="hit" aria-label="Golpe">GOLPE</button>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
