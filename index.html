<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" id="vp" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Bolonki</title>
  <link rel="stylesheet" href="./src/style.css">
  <!-- instalable: en el celular, "agregar a la pantalla de inicio" lo abre en pantalla completa -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="./icon-256.png">
  <!-- three-cdn -->
</head>
<body data-mode="menu">
  <main class="stage" id="stage" tabindex="0" aria-label="Bolonki">
    <div class="screen scanlines" id="screen">
      <canvas id="gl"></canvas>
      <canvas id="hud" width="320" height="240"></canvas>
      <canvas id="hires"></canvas>
    </div>

    <div class="touch" aria-hidden="true">
      <div class="stick" id="stick" aria-label="Mover"><div class="knob" id="knob"></div></div>
      <div class="dpad" id="dpad" aria-label="Flechas"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><b></b></div>
      <button id="tc" class="cam" aria-label="Centrar la cámara">⟲</button>
      <button id="tp" class="pause" aria-label="Pausa">❚❚</button>
      <button id="th" class="hit" aria-label="Golpe">GOLPE</button>
    </div>
    <!-- para escribir el apodo / el código desde el celular (abre el teclado del teléfono) -->
    <input id="txtin" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" inputmode="text">
    <!-- botón de pantalla completa (arriba a la derecha, en el título y el menú principal) -->
    <button id="fsbtn" class="fsbtn" aria-label="Pantalla completa" title="Pantalla completa (F)">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path class="in" d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" fill="none" stroke="currentColor" stroke-width="2"/><path class="out" d="M6 1v5H1M15 6h-5V1M10 15v-5h5M1 10h5v5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <div class="rotate" aria-hidden="true"><div>↻</div><p>GIRÁ EL CELULAR<br>PARA JUGAR</p></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
